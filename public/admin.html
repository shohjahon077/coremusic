<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreMusic Dashboard</title>
    <style>
      :root {
        --bg: #07111f; --bg-2: #0d1b2a; --primary: #55e6c1; --primary-2: #66a6ff; --text: #ecf7ff; --muted: #aac4d6; --line: rgba(255,255,255,0.08);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, sans-serif; background: linear-gradient(135deg, var(--bg), var(--bg-2)); color: var(--text); }
      .container { max-width: 1200px; margin: 0 auto; padding: 24px 18px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      .nav { display: flex; gap: 18px; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 24px; }
      .card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
      .chip { display: inline-block; background: rgba(85,230,193,0.12); padding: 8px 12px; border-radius: 999px; color: var(--primary); margin-bottom: 8px; }
      .track-list { display: grid; gap: 12px; margin-top: 12px; }
      .track-item { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid var(--line); }
      .muted { color: var(--muted); }
      @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div><strong>CoreMusic Dashboard</strong></div>
        <div class="nav">
          <a href="/">Home</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/admin">Admin</a>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="chip">Playlists</div>
          <div id="playlistCount">0</div>
        </div>
        <div class="card">
          <div class="chip">Favorites</div>
          <div id="favoriteCount">0</div>
        </div>
        <div class="card">
          <div class="chip">Total plays</div>
          <div id="totalPlays">0</div>
        </div>
      </div>

      <div class="grid" style="margin-top: 20px;">
        <div class="card">
          <h3>My playlists</h3>
          <div id="userPlaylists" class="track-list"></div>
        </div>
        <div class="card">
          <h3>Favorites</h3>
          <div id="favoriteTracks" class="track-list"></div>
        </div>
        <div class="card">
          <h3>Recent</h3>
          <div id="recentTracks" class="track-list"></div>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('coremusic_token');
      if (!token) {
        window.location.href = '/';
      }

      async function api(path) {
        const res = await fetch('/api' + path, { headers: { Authorization: 'Bearer ' + token } });
        return res.json();
      }

      async function loadDashboard() {
        const data = await api('/dashboard');
        const stats = data.stats || {};
        document.getElementById('playlistCount').textContent = stats.playlistCount || 0;
        document.getElementById('favoriteCount').textContent = stats.favoriteCount || 0;
        document.getElementById('totalPlays').textContent = stats.totalPlays || 0;

        document.getElementById('userPlaylists').innerHTML = (data.playlists || []).map(p => `<div class='track-item'><span>${p.name}</span><span class='muted'>${(p.tracks || []).length} tracks</span></div>`).join('') || '<div class="muted">No playlists yet</div>';
        document.getElementById('favoriteTracks').innerHTML = (data.favorites || []).map(t => `<div class='track-item'><span>${t.title}</span><span class='muted'>${t.artist}</span></div>`).join('') || '<div class="muted">No favorites yet</div>';
        document.getElementById('recentTracks').innerHTML = (data.recent || []).map(t => `<div class='track-item'><span>${t.title}</span><span class='muted'>${t.artist}</span></div>`).join('') || '<div class="muted">No recent tracks</div>';
      }

      loadDashboard();
    </script>
  </body>
</html>

    </script>
  </body>
</html>
